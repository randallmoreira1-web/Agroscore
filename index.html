<title>AgroScore Alta Fidelidade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: identidade "Soil Ledger" do protótipo de baixa fidelidade (papel creme, verde-folha, dourado-grão, marrom-solo) aplicada a landing + painel do analista com rotas por hash. */
:root{--bg:oklch(.955 .014 100);--fg:oklch(.22 .028 145);--card:oklch(.985 .005 100);--card2:oklch(.93 .02 100);--bd:oklch(.87 .02 100);--mu:oklch(.43 .022 130);
--pr:oklch(.42 .088 155);--prd:oklch(.32 .068 155);--prf:oklch(.985 .005 100);--gr:oklch(.65 .118 75);--grt:oklch(.5 .11 70);--so:oklch(.43 .066 60);
--ok:oklch(.42 .088 155);--wa:oklch(.5 .11 70);--rk:oklch(.5 .17 35);--okf:oklch(.42 .088 155);--waf:oklch(.65 .118 75);--rkf:oklch(.57 .17 35);
--sans:"Inter",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(.22 .028 145);--fg:oklch(.955 .014 100);--card:oklch(.28 .03 145);--card2:oklch(.33 .03 145);--bd:oklch(1 0 0/12%);--mu:oklch(.72 .02 130);--pr:oklch(.62 .1 155);--prd:oklch(.5 .08 155);--prf:oklch(.22 .028 145);--gr:oklch(.72 .12 75);--grt:oklch(.78 .12 78);--so:oklch(.62 .07 60);--ok:oklch(.74 .11 155);--wa:oklch(.8 .12 80);--rk:oklch(.75 .13 40);--okf:oklch(.62 .1 155);--waf:oklch(.72 .12 75);--rkf:oklch(.68 .15 38);color-scheme:dark}}
:root[data-theme="dark"]{--bg:oklch(.22 .028 145);--fg:oklch(.955 .014 100);--card:oklch(.28 .03 145);--card2:oklch(.33 .03 145);--bd:oklch(1 0 0/12%);--mu:oklch(.72 .02 130);--pr:oklch(.62 .1 155);--prd:oklch(.5 .08 155);--prf:oklch(.22 .028 145);--gr:oklch(.72 .12 75);--grt:oklch(.78 .12 78);--so:oklch(.62 .07 60);--ok:oklch(.74 .11 155);--wa:oklch(.8 .12 80);--rk:oklch(.75 .13 40);--okf:oklch(.62 .1 155);--waf:oklch(.72 .12 75);--rkf:oklch(.68 .15 38);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.w{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid var(--bd);background:color-mix(in oklch,var(--bg) 78%,transparent);backdrop-filter:blur(10px)}
.top{display:flex;align-items:center;gap:14px;height:64px}
.logo{background:#fff;border-radius:9px;padding:3px 9px;display:flex;border:1px solid var(--bd);cursor:pointer;flex:none}.logo img{height:30px;display:block}
.tag{font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mu);display:none}
@media(min-width:980px){.tag{display:inline}}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:7px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--fg)}nav button.on{color:var(--pr);background:color-mix(in oklch,var(--pr) 12%,transparent)}
.cta{border:0;background:var(--pr);color:var(--prf);padding:9px 16px;border-radius:7px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap;flex:none}.cta:hover{background:var(--prd)}
@media(max-width:760px){.cta{display:none}}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
main{padding-block:0 40px;min-height:70vh}
.eb{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--grt)}
.mono{font-family:var(--mono)}
h1,h2,h3{text-wrap:balance;letter-spacing:-.02em;margin:0}
h1{font:800 clamp(34px,5vw,56px)/1.04 var(--sans);max-width:16ch}
h2{font:700 clamp(22px,3vw,28px)/1.2 var(--sans)}
h3{font:700 16px/1.3 var(--sans);letter-spacing:-.01em}
p{margin:0}.mu{color:var(--mu)}.ok{color:var(--ok)}.wa{color:var(--wa)}.rk{color:var(--rk)}
.sec{padding-block:56px}.band{border-block:1px solid var(--bd);background:color-mix(in oklch,var(--card) 55%,transparent)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;min-width:0}
.card.hl{border:2px solid var(--pr)}
.mt{margin-top:16px}.mt2{margin-top:28px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gd{display:grid;grid-template-columns:5fr 7fr;gap:16px}
@media(max-width:860px){.gd,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:10px 16px;border-radius:8px;font:600 14px var(--sans);cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:color-mix(in oklch,var(--fg) 35%,transparent)}
.btn.p{background:var(--pr);border-color:var(--pr);color:var(--prf)}.btn.p:hover{background:var(--prd);border-color:var(--prd)}
.btn.sm{padding:5px 11px;font-size:13px}.btn.ghost{border-color:transparent;background:none;color:var(--pr);padding-inline:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font:600 12px var(--sans);border:1px solid currentColor;white-space:nowrap}
.bar{height:7px;border-radius:9px;background:color-mix(in oklch,var(--bd) 80%,transparent);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transform-origin:left;animation:grow .8s cubic-bezier(.32,.72,0,1) both}
@keyframes grow{from{transform:scaleX(0)}}@keyframes rise{from{opacity:.001;transform:translateY(12px)}}@keyframes draw{from{stroke-dashoffset:900}}
.rise{animation:rise .5s cubic-bezier(.32,.72,0,1) both}
.ch{stroke-dasharray:900;animation:draw 1.3s cubic-bezier(.32,.72,0,1) both}
@media (prefers-reduced-motion:reduce){.bar i,.rise,.ch{animation:none}html{scroll-behavior:auto}}
.k{color:var(--mu);font-size:13px}.lab{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.v{font:800 26px/1.1 var(--sans);letter-spacing:-.02em}.vm{font:700 26px var(--mono)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input[type=range]{padding:0;accent-color:var(--pr)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.err{color:var(--rk);font-size:13px;margin-top:8px}
/* landing */
.hero{display:grid;grid-template-columns:7fr 5fr;gap:40px;align-items:center;padding-block:64px 56px}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding-block:40px}}
.chipl{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:4px 12px;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.chipl::before{content:"";width:6px;height:6px;border-radius:9px;background:var(--gr)}
.lead{font-size:18px;color:var(--mu);max-width:46ch;margin-top:20px;text-wrap:pretty}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:28px;font:500 12px var(--mono);color:var(--mu)}
.stat-n{font:700 22px var(--mono);color:var(--fg);display:block}
.steps .n{font:500 12px var(--mono);color:var(--mu)}
.price{font:700 28px var(--mono);margin-top:14px}.price small{font:500 13px var(--sans);color:var(--mu)}
.q{border-left:3px solid var(--pr);padding-left:14px;color:var(--mu);font-size:14px}
/* painel */
.ph{padding-block:28px 6px}
.crumb{display:flex;gap:6px;align-items:center;font:500 12px var(--mono);color:var(--mu);margin-bottom:10px}
.crumb button{border:0;background:none;color:var(--pr);font:inherit;cursor:pointer;padding:0}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:6px 13px;border-radius:99px;font:600 13px var(--sans);cursor:pointer}.chip.on{background:var(--pr);color:var(--prf);border-color:var(--pr)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:10px;cursor:pointer;flex-wrap:wrap;transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--pr);transform:translateY(-1px)}
.row .l{flex:1 1 240px;min-width:0}.row .r{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mini{width:84px}.sn{font:800 24px var(--mono);min-width:44px;text-align:right}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-radius:12px;border:1px solid currentColor;margin-bottom:10px;font-size:14px;background:var(--card)}.alert span{color:var(--fg)}
.guide{background:color-mix(in oklch,var(--pr) 9%,var(--card));border-color:color-mix(in oklch,var(--pr) 40%,var(--bd))}.guide ol{margin:8px 0 0;padding-left:20px}
.ind{display:block;width:100%;text-align:center;border:1px solid transparent;background:var(--bg);border-radius:10px;padding:10px 4px;cursor:pointer;color:inherit;font:inherit;position:relative}
.ind:hover{border-color:color-mix(in oklch,var(--pr) 40%,transparent);background:color-mix(in oklch,var(--pr) 6%,var(--bg))}
.ib{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:99px;border:0;background:none;color:var(--mu);cursor:pointer;font:700 11px var(--mono);display:grid;place-items:center}
.ib:hover{background:color-mix(in oklch,var(--pr) 12%,transparent);color:var(--pr)}
.qb{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.qb button{border:0;background:none;border-radius:6px;padding:5px 0;font:500 10px var(--mono);color:var(--mu);cursor:pointer}.qb button.on{background:color-mix(in oklch,var(--pr) 12%,transparent);color:var(--pr);font-weight:700}
@media(max-width:600px){.qb{grid-template-columns:repeat(4,1fr)}}
.fl{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:10px}
.ev{border-left:3px solid var(--pr);padding:2px 0 2px 14px;margin:0 0 12px}
.dc{margin-top:16px;border:1px solid currentColor;border-radius:12px;padding:14px 16px;background:var(--card)}.dc p{color:var(--fg)}
.hyp{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--bd)}.hyp:first-of-type{border-top:0}
.hyp b.c{font:700 16px var(--mono);color:var(--pr)}
textarea.out{font:12px/1.5 var(--mono);min-height:130px}
.drop{border:1.5px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;background:var(--bg)}
.drop input{border:0;background:none;padding:6px}
/* modal + toast */
.ov{position:fixed;inset:0;z-index:60;background:oklch(.15 .02 145/55%);display:grid;place-items:center;padding:16px;overflow-y:auto}
.md{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;position:relative;animation:rise .25s both}
.x{position:absolute;top:12px;right:12px;border:0;background:none;color:var(--mu);font-size:22px;line-height:1;cursor:pointer;width:32px;height:32px;border-radius:8px}.x:hover{background:var(--card2)}
.hb{display:flex;align-items:flex-end;gap:7px;height:96px;margin-top:10px}.hb div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;text-align:center;font:500 9px var(--mono);color:var(--mu)}.hb i{display:block;width:100%;border-radius:3px 3px 0 0}
.leit{border-left:2px solid var(--pr);background:color-mix(in oklch,var(--pr) 7%,transparent);padding:10px 14px;border-radius:0 8px 8px 0}
dl{display:grid;gap:12px;margin:14px 0 0}dt{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}dd{margin:2px 0 0;font-size:14px}.dlw{border-left:2px solid color-mix(in oklch,var(--pr) 45%,transparent);padding-left:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);text-align:center}
footer{border-top:1px solid var(--bd)}
footer .w{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding-block:26px;font:400 12px var(--mono);color:var(--mu)}
.sw{overflow-x:auto}
